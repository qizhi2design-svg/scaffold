<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title" id="pageTitle">{{title}}</h1>
            <p class="subtitle" id="pageSubtitle">这是一个原型页面示例</p>
        </header>

        <main class="main-content">
            <section class="feature-section">
                <h2>核心功能</h2>
                <div class="feature-grid" id="featureGrid"></div>
            </section>

            <section class="action-section">
                <h2>操作示例</h2>
                <div class="action-container">
                    <input type="text" id="userInput" class="input-field" placeholder="输入内容...">
                    <button id="submitBtn" class="primary-button">提交</button>
                </div>
                <div id="result" class="result-message"></div>
            </section>
        </main>

        <footer class="footer">
            <p>&copy; 2024 {{title}} - 使用 PRDKit 创建</p>
        </footer>
    </div>

    <script src="mock.js"></script>
    <script src="script.js"></script>
</body>
</html>
