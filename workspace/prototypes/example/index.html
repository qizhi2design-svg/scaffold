<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>示例原型</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 data-mark="title">产品标题</h1>
            <p class="subtitle">简短的产品描述</p>
        </header>

        <main class="main-content">
            <section class="feature-section">
                <div class="feature-card" data-mark="feature-1">
                    <div class="feature-icon">🎯</div>
                    <h3>核心功能 1</h3>
                    <p>功能描述文字</p>
                </div>

                <div class="feature-card" data-mark="feature-2">
                    <div class="feature-icon">⚡</div>
                    <h3>核心功能 2</h3>
                    <p>功能描述文字</p>
                </div>

                <div class="feature-card" data-mark="feature-3">
                    <div class="feature-icon">🚀</div>
                    <h3>核心功能 3</h3>
                    <p>功能描述文字</p>
                </div>
            </section>

            <section class="action-section">
                <button class="primary-button" data-mark="cta-button">开始使用</button>
            </section>
        </main>

        <footer class="footer">
            <p>© 2024 产品名称</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
