<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{title}}</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone-shell">
        <div class="status-bar">
            <span>9:41</span>
            <span>5G</span>
        </div>

        <main class="screen">
            <section class="hero-card">
                <p class="eyebrow" id="heroEyebrow">移动端验证模板</p>
                <h1 class="title" id="heroTitle">{{title}}</h1>
                <p class="subtitle" id="heroSubtitle">用于快速起一个适合 App / H5 的单页原型骨架。</p>
                <button class="primary-cta" id="heroAction">立即体验</button>
            </section>

            <section class="module-section">
                <div class="section-heading">
                    <h2 id="moduleSectionTitle">关键流程</h2>
                    <button class="ghost-button" id="toggleTips">查看提示</button>
                </div>
                <div class="module-list" id="moduleList"></div>
            </section>

            <section class="composer-card">
                <label class="composer-label" id="composerLabel" for="mobileInput">输入想验证的场景</label>
                <div class="composer-row">
                    <input id="mobileInput" class="composer-input" type="text" placeholder="例如：新用户首次下单">
                    <button class="secondary-cta" id="submitNote">记录</button>
                </div>
                <p class="helper-text" id="helperText">建议一句话写清你的假设。</p>
            </section>
        </main>

        <nav class="tab-bar" id="tabBar"></nav>
    </div>

    <script src="mock.js"></script>
    <script src="script.js"></script>
</body>
</html>
