<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand" id="brandName">PRDKit Admin</div>
            <nav class="nav-group" id="navGroup"></nav>
        </aside>

        <div class="content-shell">
            <header class="topbar">
                <div>
                    <p class="eyebrow" id="pageEyebrow">PC 后台模板</p>
                    <h1 class="title" id="pageTitle">{{title}}</h1>
                </div>
                <button class="primary-button" id="newTaskButton">新建任务</button>
            </header>

            <main class="workspace">
                <section class="stats-grid" id="statsGrid"></section>

                <section class="panel">
                    <div class="panel-head">
                        <div>
                            <h2 id="panelTitle">任务列表</h2>
                            <p id="panelDescription">适合验证后台列表、筛选、批量操作等高频场景。</p>
                        </div>
                        <div class="toolbar">
                            <input class="search-input" id="searchInput" type="search" placeholder="搜索任务标题">
                            <button class="secondary-button" id="resetButton">重置</button>
                        </div>
                    </div>

                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>任务</th>
                                <th>负责人</th>
                                <th>状态</th>
                                <th>更新时间</th>
                            </tr>
                        </thead>
                        <tbody id="taskTableBody"></tbody>
                    </table>
                </section>
            </main>
        </div>
    </div>

    <script src="mock.js"></script>
    <script src="script.js"></script>
</body>
</html>
